<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111827; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    a { color: #4338CA; } a:hover { color: #111827; }
    .opt { display: flex; align-items: center; gap: 10px; padding: 13px 12px; border-radius: 12px; font-weight: 600; font-size: 15px; background: #F4F5F7; min-height: 44px; }
    .opt i { display: block; width: 8px; height: 8px; border-radius: 50%; }
    .opt .n { margin-left: auto; font-size: 12.5px; font-weight: 500; color: #9CA3AF; }
  </style>
</helmet>
<div style="width: 390px; height: 860px; background: rgba(17,24,39,.45); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;">
  <div style="background: #fff; border-radius: 20px 20px 0 0; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 6px;">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #EAECEF; margin: 4px auto 8px;"></div>
    <div style="font-size: 18px; font-weight: 700; letter-spacing: -.01em;">Category</div>
    <div style="font-size: 13px; color: #6B7280; margin-bottom: 8px;">Pick one, or add your own. New ones go into your sheet's Settings tab.</div>

    <div class="opt"><i style="background: #6366F1;"></i>Rent<span class="n">1 template</span></div>
    <div class="opt"><i style="background: #0EA5E9;"></i>Bills<span class="n">6</span></div>
    <div class="opt"><i style="background: #F59E0B;"></i>School</div>
    <div class="opt"><i style="background: #10B981;"></i>Travel<span class="n">2</span></div>
    <div class="opt" style="background: #111827; color: #fff;"><i style="background: #8B5CF6;"></i>Entertainment<span class="n" style="color: rgba(255,255,255,.7);">3 subscriptions</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"></path></svg></div>
    <div class="opt"><i style="background: #EC4899;"></i>Other<span class="n">4</span></div>
    <div class="opt"><i style="background: #14B8A6;"></i>Planned<span class="n">1</span></div>

    <div style="height: 1px; background: #F1F2F4; margin: 8px 0 6px;"></div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 12px; border-radius: 12px; border: 1px dashed #D0D5DD; min-height: 44px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      <div style="flex: 1; font-size: 15px; font-weight: 600; color: #6B7280;">New category</div>
    </div>

    <div style="margin-top: 6px; border: 1px solid #111827; border-radius: 14px; padding: 12px 12px 12px; display: flex; flex-direction: column; gap: 10px; background: #fff;">
      <div style="font-size: 12px; font-weight: 600; color: #6B7280;">New category</div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="flex: 1; padding: 11px 12px; border: 1px solid #EAECEF; border-radius: 12px; background: #FAFAFB; font-size: 16px;">Health<span style="display: inline-block; width: 1px; height: 18px; background: #111827; vertical-align: -3px; margin-left: 1px;"></span></div>
        <div style="padding: 11px 16px; border-radius: 12px; background: #111827; color: #fff; font-size: 14px; font-weight: 600; min-height: 44px; display: flex; align-items: center;">Add</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6B7280;">Colour<span style="width: 18px; height: 18px; border-radius: 50%; background: #F97316; display: block; outline: 2px solid #111827; outline-offset: 2px;"></span><span style="width: 18px; height: 18px; border-radius: 50%; background: #64748B; display: block;"></span><span style="width: 18px; height: 18px; border-radius: 50%; background: #0EA5E9; display: block;"></span><span style="width: 18px; height: 18px; border-radius: 50%; background: #10B981; display: block;"></span><span style="width: 18px; height: 18px; border-radius: 50%; background: #EC4899; display: block;"></span><span style="margin-left: auto; color: #9CA3AF;">next free colour picked for you</span></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
