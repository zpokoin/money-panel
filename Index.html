<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Money Panel</title>
<style>
:root{
  --bg:#F3F4F6; --card:#FFFFFF; --text:#111827; --muted:#6B7280; --faint:#9CA3AF; --line:#E5E7EB;
  --good:#15803D; --good-bg:#DCFCE7; --good-strong:#16A34A;
  --bad:#B91C1C; --bad-bg:#FEE2E2; --bad-strong:#DC2626;
  --neutral-bg:#E5E7EB; --accent:#111827;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.06);
  --c-income:#16A34A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
.hidden{display:none!important}

/* Top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em;margin-right:auto;white-space:nowrap}
.chip-view{font-size:12px;color:var(--muted);background:var(--neutral-bg);padding:3px 8px;border-radius:999px}
.icon-btn{height:44px;min-width:44px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--text);background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.icon-btn:hover{background:#fff;box-shadow:0 2px 4px rgba(16,24,40,.08),0 8px 20px rgba(16,24,40,.1)}
.icon-btn.on{background:var(--accent);color:#fff}
.icon-btn svg{width:22px;height:22px;flex:0 0 auto}
.icon-btn .lbl{display:none}
@media(min-width:760px){.icon-btn .lbl{display:inline}}
.progress{height:2px;margin:0 -16px;background:transparent;position:sticky;top:64px;z-index:5;overflow:hidden}
.progress.on::after{content:"";display:block;height:100%;width:40%;background:var(--accent);animation:slide 1s infinite linear;border-radius:2px}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* Tabs */
.tabs{display:flex;gap:4px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:8px 4px;border-radius:12px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--text);font-weight:600}
.bottom-tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6}
.bottom-tabs .inner{max-width:520px;margin:0 auto;display:flex;gap:4px}
.top-tabs{display:none}
@media(min-width:760px){
  .app{padding-bottom:60px}
  .bottom-tabs{display:none}
  .top-tabs{display:flex;gap:2px;background:var(--card);padding:4px;border-radius:12px;box-shadow:var(--shadow);margin-right:14px}
  .top-tabs button{flex-direction:row;font-size:13px;padding:6px 12px;gap:6px}
  .top-tabs button svg{width:16px;height:16px}
  .top-tabs button.on{background:var(--bg)}
}

/* Month nav */
.month-nav{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0 12px}
.month-nav{gap:10px}
.month-nav .arrow{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text);background:var(--card);box-shadow:var(--shadow)}
.month-nav .arrow:hover{background:#fff;color:var(--good)}
.month-nav .arrow svg{width:20px;height:20px}
.month-pill{font-weight:600;font-size:17px;padding:10px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;min-width:140px;justify-content:center}
.month-pill .today{font-size:11px;font-weight:500;color:var(--good);background:var(--good-bg);padding:1px 7px;border-radius:999px}

/* Banner */
.banner{border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;color:#fff;box-shadow:var(--shadow)}
.banner.good{background:linear-gradient(135deg,#16A34A,#15803D)}
.banner.bad{background:linear-gradient(135deg,#DC2626,#B91C1C)}
.banner.unknown{background:linear-gradient(135deg,#4B5563,#374151)}
.banner-label{font-size:13px;opacity:.85;font-weight:500}
.banner-value{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:2px 0 8px}
.banner-value .cur{font-size:18px;font-weight:600;opacity:.8;margin-right:4px;vertical-align:baseline}
.banner-value{margin-bottom:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;transition:background .12s}
button.tile:hover{background:rgba(255,255,255,.26)}
button.tile:active{background:rgba(255,255,255,.34)}
.tile .t-label{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:12px;font-weight:600;letter-spacing:.02em;opacity:.9}
.tile .t-label svg{width:15px;height:15px;opacity:.95}
.tile .t-edit{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;background:rgba(255,255,255,.22);padding:2px 7px 2px 6px;border-radius:999px}
.tile .t-value{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.tile .t-value .cur{font-size:12px}
.tile .t-sub{font-size:11px;opacity:.8}
.tile.cta .t-value{font-size:16px;text-decoration:underline;text-underline-offset:3px}
.tile.wide{grid-column:1/-1}
.tile.wide .t-row{display:flex;align-items:baseline;justify-content:space-between;width:100%;gap:10px;flex-wrap:wrap}
.tile.wide .t-sub{font-size:12px;opacity:.9}
.banner-note{font-size:12px;opacity:.8;margin-top:-6px;margin-bottom:12px}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-pad{padding:16px}
.summary{display:flex;align-items:center;gap:16px;padding:16px}
.ring{flex:0 0 auto;width:84px;height:84px;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-label{font-size:12px;color:var(--muted);font-weight:500}
.stat-value{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.stat-value.good{color:var(--good)}
.stat-sub{font-size:12px;color:var(--faint)}
.cur{font-size:.8em;font-weight:600;color:inherit;opacity:.7;margin-right:3px}
.masked{letter-spacing:.1em;opacity:.7}

/* Groups and rows */
.group-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;text-align:left;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
.group-head .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.group-head .count{font-weight:500;color:var(--faint);font-size:12px}
.group-head .amt{margin-left:auto;font-weight:600;color:var(--muted);font-size:13px}
.group-head .chev{width:16px;height:16px;color:var(--faint);transition:transform .15s}
.group-head.collapsed .chev{transform:rotate(-90deg)}
.group-head.collapsed{border-bottom:0}
.card .group-head:first-child{border-top:0}
.group + .group .group-head{border-top:1px solid var(--line)}
.rows{padding:4px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px}
.row + .row{border-top:1px solid #F3F4F6}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid #D1D5DB;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;color:#fff;transition:all .12s}
.tick:hover{border-color:var(--good-strong)}
.tick.done{background:var(--good-strong);border-color:var(--good-strong)}
.tick svg{width:15px;height:15px}
.tick[disabled]{cursor:default}
.avatar{width:36px;height:36px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:0 0 auto}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{font-weight:600;font-size:15px;white-space:nowrap}
.row.paid .row-name,.row.paid .row-amt{color:var(--muted);font-weight:500}
.row.off{opacity:.55}
.more{width:32px;height:32px;border-radius:8px;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;margin-right:-8px}
.more:hover{background:var(--bg);color:var(--text)}
.more svg{width:18px;height:18px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--neutral-bg);color:var(--muted)}
.badge.paid{background:var(--good-bg);color:var(--good)}
.badge.proj{background:#EEF2FF;color:#4338CA}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);margin-bottom:4px}
.empty .btn{margin-top:12px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--accent);color:#fff}
.btn.secondary{background:var(--neutral-bg);color:var(--text)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%;padding:13px}
.btn[disabled]{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;margin-top:6px}
.btn-row .btn{flex:1}
.fab{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;
  box-shadow:0 8px 24px rgba(17,24,39,.3);display:inline-flex;align-items:center;justify-content:center;z-index:6}
.fab svg{width:26px;height:26px}
@media(min-width:760px){.fab{bottom:28px;right:calc(50% - 260px)}}
.seg{display:inline-flex;background:var(--neutral-bg);padding:3px;border-radius:10px;gap:2px;margin:4px 0 12px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:600}

/* Forecast */
.chart{padding:16px 8px 8px}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart svg{display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:6px 8px 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.fc-head,.fc-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.1fr;gap:6px;padding:10px 16px;align-items:center}
.fc-head{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.fc-head span:not(:first-child),.fc-row span:not(:first-child){text-align:right}
.fc-row{width:100%;text-align:left;font-size:14px}
.fc-row + .fc-row,.fc-detail + .fc-row{border-top:1px solid #F3F4F6}
.fc-row .m{font-weight:600}
.fc-row .m small{display:block;font-size:11px;color:var(--faint);font-weight:500}
.fc-row .neg{color:var(--bad)}
.fc-row .pos{color:var(--good)}
.fc-detail{background:#FAFAFB;padding:6px 16px 10px;border-top:1px solid #F3F4F6}
.fc-detail .line{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.fc-detail .line .n{color:var(--muted)}
.fc-detail .line.item{padding-left:14px}
.fc-detail .line.total{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:600}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@media(min-width:760px){.backdrop{align-items:center}.sheet{border-radius:20px;animation:fade .15s}}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.sheet p.hint{margin:0 0 14px;color:var(--muted);font-size:13px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#FAFAFB;font-size:16px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff}
.field textarea{min-height:64px;resize:vertical}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--text);font-weight:500;font-size:14px}
.field.check input{width:20px;height:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:12px;font-weight:600;background:var(--bg);text-align:left}
.menu button.danger{color:var(--bad)}
.menu button svg{width:18px;height:18px;color:var(--muted)}
.menu button.danger svg{color:var(--bad)}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1F2937;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:14px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.toast button{color:#86EFAC;font-weight:700}
@media(min-width:760px){.toast{bottom:28px}}
.setup{padding:24px;text-align:center}
.setup code{background:var(--bg);padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Money Panel</div>
    <nav class="tabs top-tabs" data-tabs></nav>
    <span class="chip-view hidden" id="viewChip">View only</span>
    <button class="icon-btn" id="btnSens" title="Hide salary and balance"></button>
    <button class="icon-btn" id="btnAll" title="Hide all numbers"></button>
  </header>
  <div class="progress" id="progress"></div>
  <main id="view"></main>
</div>
<nav class="tabs bottom-tabs"><div class="inner" data-tabs></div></nav>
<button class="fab hidden" id="fab" aria-label="Add"></button>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
/* ------------------------------------------------------------------ icons */
var I = {
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.5 10.5 0 0 1 12 19c-6.5 0-10-7-10-7a17 17 0 0 1 4.1-4.9M9.9 5.2A9.5 9.5 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.2"/><path d="M14.1 14.1a3 3 0 0 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>',
  hash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg>',
  hashOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/><path d="M3 3l18 18" stroke-width="2.5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 6l6 6-6 6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 8l8 8M16 8l-8 8"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-2"/></svg>',
  tMonth: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M8 14l3 3 5-5"/></svg>',
  tForecast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M8 15v-4M12 15V8M16 15v-6"/></svg>',
  tPlanned: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>',
  tRecurring: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>'
};

/* ------------------------------------------------------------------ state */
var CATS = [];          // filled from the server (Settings tab)
var CUR = '';           // currency code, from Settings
var PALETTE = ['#6366F1', '#0EA5E9', '#F59E0B', '#10B981', '#8B5CF6', '#EC4899', '#14B8A6', '#F97316', '#64748B'];
var TABS = [
  { id: 'month', label: 'Month', icon: I.tMonth },
  { id: 'forecast', label: 'Forecast', icon: I.tForecast },
  { id: 'planned', label: 'Planned', icon: I.tPlanned },
  { id: 'recurring', label: 'Recurring', icon: I.tRecurring }
];
var S = {
  boot: null, tab: 'month', month: null, fcCount: 6,
  data: { month: null, forecast: null, planned: null, recurring: null },
  mask: { sens: false, all: false },
  collapsed: {}, paidOpen: false, fcOpen: {}, busy: 0
};
try { var saved = JSON.parse(localStorage.getItem('budget.mask') || '{}'); S.mask.sens = !!saved.sens; S.mask.all = !!saved.all; } catch (e) {}

/* ------------------------------------------------------------------ server */
function api(fn) {
  var args = [].slice.call(arguments, 1);
  busy(1);
  return new Promise(function (resolve, reject) {
    var runner = google.script.run
      .withSuccessHandler(function (r) { busy(-1); resolve(r); })
      .withFailureHandler(function (e) { busy(-1); reject(e && e.message ? e : new Error(String(e))); });
    runner[fn].apply(runner, args);
  });
}
function busy(d) { S.busy = Math.max(0, S.busy + d); $('#progress').classList.toggle('on', S.busy > 0); }

/* ------------------------------------------------------------------ helpers */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return [].slice.call((root || document).querySelectorAll(sel)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function monthLabel(m) { if (!m) return ''; var p = m.split('-'); return MONTHS[Number(p[1]) - 1] + ' ' + p[0]; }
function monthShort(m) { var p = m.split('-'); return MONTHS[Number(p[1]) - 1] + (p[1] === '01' ? ' ' + p[0].slice(2) : ''); }
function dateLabel(d) { if (!d) return ''; var p = d.split('-'); return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1]; }
function monthAdd(m, n) { var p = m.split('-'); var y = Number(p[0]), mo = Number(p[1]) - 1 + n; y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12; return y + '-' + (mo + 1 < 10 ? '0' : '') + (mo + 1); }
function fmtNum(n) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function money(v, sens) {
  if (v === null || v === undefined || v === '') return '<span class="masked">—</span>';
  if (S.mask.all || (sens && S.mask.sens)) return '<span class="masked">••••</span>';
  var n = Number(v);
  return (n < 0 ? '−' : '') + (CUR ? '<span class="cur">' + esc(CUR) + '</span>' : '') + fmtNum(Math.abs(n));
}
function isMasked(sens) { return S.mask.all || (sens && S.mask.sens); }
function catColor(c) { if (c === 'Income') return 'var(--c-income)'; var i = CATS.indexOf(c); return PALETTE[(i < 0 ? PALETTE.length - 1 : i) % PALETTE.length]; }
function catOr(name, fallbackIndex) { return CATS.indexOf(name) >= 0 ? name : CATS[Math.min(fallbackIndex, CATS.length - 1)]; }
function initial(name) { return (name || '?').trim().charAt(0).toUpperCase(); }
function owner() { return !!(S.boot && S.boot.isOwner); }
function repeatLabel(n) { n = Number(n); return n === 1 ? 'Every month' : n === 12 ? 'Every year' : 'Every ' + n + ' months'; }

/* ------------------------------------------------------------------ boot */
function init() {
  renderTabs();
  $('#fab').innerHTML = I.plus;
  $('#fab').addEventListener('click', onFab);
  $('#btnSens').addEventListener('click', function () { S.mask.sens = !S.mask.sens; saveMask(); });
  $('#btnAll').addEventListener('click', function () { S.mask.all = !S.mask.all; saveMask(); });
  renderMaskButtons();
  api('getBootstrap').then(applyBoot).catch(showError);
}
function applyBoot(b) {
  S.boot = b;
  S.month = b.currentMonth;
  CATS = b.categories || [];
  CUR = b.currency || '';
  $('#viewChip').classList.toggle('hidden', b.isOwner);
  if (!b.ready || !b.configured) {
    if (b.isOwner) { $('#view').innerHTML = ''; welcome(); }
    else $('#view').innerHTML = '<div class="card setup"><h2>Not set up yet</h2><p>The owner of this panel has not finished setting it up. Ask them to open it once.</p></div>';
    return;
  }
  show('month');
}
function welcome() {
  formSheet({
    title: 'Welcome to Money Panel',
    hint: 'This is a monthly money plan, not a transaction tracker: salary in, bills out, what is left. You tick bills as you pay them. Three quick answers to start; everything can be changed later.',
    fields: [
      { name: 'currency', label: 'Currency code', type: 'text', required: true, placeholder: 'e.g. USD, EUR, GBP', autofocus: true },
      { name: 'salary', label: 'Monthly salary (optional)', type: 'number', placeholder: '0' },
      { name: 'balance', label: 'Bank balance right now (optional)', type: 'number', placeholder: '0' }
    ],
    submit: 'Start',
    noCancel: true,
    onSubmit: function (v) {
      return api('completeSetup', v).then(function (b) {
        S.data = { month: null, forecast: null, planned: null, recurring: null };
        applyBoot(b);
        toast('Ready. Add your bills in the Recurring tab.');
      });
    }
  });
}
function saveMask() { try { localStorage.setItem('budget.mask', JSON.stringify(S.mask)); } catch (e) {} renderMaskButtons(); render(); }
function renderMaskButtons() {
  var a = $('#btnSens'), b = $('#btnAll');
  a.innerHTML = (S.mask.sens ? I.eyeOff : I.eye) + '<span class="lbl">' + (S.mask.sens ? 'Show balance' : 'Hide balance') + '</span>'; a.classList.toggle('on', S.mask.sens);
  a.title = S.mask.sens ? 'Show salary and balance' : 'Hide salary and balance';
  b.innerHTML = (S.mask.all ? I.hashOff : I.hash) + '<span class="lbl">' + (S.mask.all ? 'Show numbers' : 'Hide numbers') + '</span>'; b.classList.toggle('on', S.mask.all);
  b.title = S.mask.all ? 'Show all numbers' : 'Hide all numbers';
}
function renderTabs() {
  $$('[data-tabs]').forEach(function (nav) {
    nav.innerHTML = TABS.map(function (t) { return '<button data-tab="' + t.id + '" class="' + (t.id === S.tab ? 'on' : '') + '">' + t.icon + '<span>' + t.label + '</span></button>'; }).join('');
    $$('button', nav).forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-tab')); }); });
  });
}
function show(tab) {
  S.tab = tab; renderTabs();
  $('#fab').classList.toggle('hidden', !owner() || tab === 'forecast');
  window.scrollTo(0, 0);
  load();
}
function load() {
  var v = $('#view');
  if (S.tab === 'month') {
    if (!S.data.month || S.data.month.month !== S.month) v.innerHTML = skeleton();
    return api('getMonth', S.month).then(function (d) { S.data.month = d; render(); }).catch(showError);
  }
  if (S.tab === 'forecast') {
    if (!S.data.forecast) v.innerHTML = skeleton();
    return api('getForecast', S.boot.currentMonth, S.fcCount).then(function (d) { S.data.forecast = d; render(); }).catch(showError);
  }
  if (S.tab === 'planned') {
    if (!S.data.planned) v.innerHTML = skeleton();
    return api('getPlanned').then(function (d) { S.data.planned = d; render(); }).catch(showError);
  }
  if (S.tab === 'recurring') {
    if (!S.data.recurring) v.innerHTML = skeleton();
    return api('getRecurring').then(function (d) { S.data.recurring = d; render(); }).catch(showError);
  }
}
function invalidate() { S.data.forecast = null; S.data.planned = null; }
function skeleton() { return '<div class="card" style="height:120px;opacity:.5"></div><div class="card" style="height:200px;opacity:.35"></div>'; }
function render() {
  if (S.tab === 'month') renderMonth();
  else if (S.tab === 'forecast') renderForecast();
  else if (S.tab === 'planned') renderPlanned();
  else renderRecurring();
}
function showError(e) { console.error(e); toast((e && e.message) || String(e)); }

/* ------------------------------------------------------------------ month view */
function renderMonth() {
  var d = S.data.month; if (!d) return;
  var isCur = d.month === S.boot.currentMonth;
  var h = '';
  h += '<div class="month-nav"><button class="arrow" data-nav="-1" aria-label="Previous month">' + I.left + '</button>' +
       '<button class="month-pill" data-nav="0" title="Back to this month">' + esc(monthLabel(d.month)) + (isCur ? '<span class="today">now</span>' : '') + '</button>' +
       '<button class="arrow" data-nav="1" aria-label="Next month">' + I.right + '</button></div>';

  var cls = d.left === null ? 'unknown' : d.left < 0 ? 'bad' : 'good';
  h += '<section class="banner ' + cls + '"><div class="banner-label">Left for expenses' + (isCur ? '' : ' · ' + esc(monthLabel(d.month))) + '</div>';
  h += '<div class="banner-value">' + (d.left === null ? '<span style="font-size:22px;font-weight:600">Balance not set</span>' : money(d.left, true)) + '</div>';
  if (d.reserveTotal) h += '<div class="banner-note">after keeping ' + money(d.reserveTotal, true) + ' in reserve</div>';
  h += '<div class="tiles">';
  h += tile('Balance', d.balance === null ? null : money(d.balance, true), d.balance === null ? 'Tap to enter' : (d.balance_updated ? 'updated ' + esc(dateLabel(d.balance_updated)) : ''), 'balance', d.balance === null);
  h += tile('Salary', money(d.salary, true), isCur ? 'this month' : esc(monthLabel(d.month)), 'salary', false);
  h += reserveTile(d);
  h += '</div>';
  h += '</section>';

  var pendingItems = d.items.filter(function (i) { return i.status !== 'paid'; });
  var paidItems = d.items.filter(function (i) { return i.status === 'paid'; });
  var total = d.totals.pending + d.totals.paid;
  var frac = total > 0 ? d.totals.paid / total : 0;
  var C = 2 * Math.PI * 36;
  h += '<section class="card summary"><div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="#E5E7EB" stroke-width="9"/>' +
       '<circle cx="42" cy="42" r="36" fill="none" stroke="#16A34A" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (C * frac).toFixed(1) + ' ' + C.toFixed(1) + '"/></svg>' +
       '<div class="pct">' + (isMasked(false) ? '••' : Math.round(frac * 100) + '%') + '</div></div>' +
       '<div class="stats"><div><div class="stat-label">Left to pay</div><div class="stat-value">' + money(d.totals.pending) + '</div><div class="stat-sub">' + pendingItems.length + ' item' + (pendingItems.length === 1 ? '' : 's') + '</div></div>' +
       '<div><div class="stat-label">Paid so far</div><div class="stat-value good">' + money(d.totals.paid) + '</div><div class="stat-sub">' + paidItems.length + ' item' + (paidItems.length === 1 ? '' : 's') + '</div></div></div></section>';

  if (!d.items.length) {
    h += '<section class="card"><div class="empty"><strong>Nothing in ' + esc(monthLabel(d.month)) + ' yet</strong>Recurring bills appear here automatically when they are due.' +
         (owner() ? '<br><button class="btn" data-act="add">Add an expense</button>' : '') + '</div></section>';
  } else {
    h += '<section class="card">';
    if (!pendingItems.length) h += '<div class="empty"><strong>All paid for ' + esc(monthLabel(d.month)) + '</strong>Nothing left to pay this month.</div>';
    CATS.forEach(function (c) {
      var list = pendingItems.filter(function (i) { return i.category === c; });
      if (!list.length) return;
      var sum = list.reduce(function (a, i) { return a + i.amount; }, 0);
      var col = !!S.collapsed[c];
      h += '<div class="group"><button class="group-head ' + (col ? 'collapsed' : '') + '" data-group="' + esc(c) + '"><span class="dot" style="background:' + catColor(c) + '"></span>' + esc(c) +
           '<span class="count">' + list.length + '</span><span class="amt">' + money(sum) + '</span>' + I.chev + '</button>';
      if (!col) h += '<div class="rows">' + list.map(itemRow).join('') + '</div>';
      h += '</div>';
    });
    h += '</section>';
    if (paidItems.length) {
      h += '<section class="card"><button class="group-head ' + (S.paidOpen ? '' : 'collapsed') + '" data-group="__paid"><span class="dot" style="background:var(--good-strong)"></span>Paid' +
           '<span class="count">' + paidItems.length + '</span><span class="amt">' + money(d.totals.paid) + '</span>' + I.chev + '</button>';
      if (S.paidOpen) h += '<div class="rows">' + paidItems.map(itemRow).join('') + '</div>';
      h += '</section>';
    }
  }
  $('#view').innerHTML = h;
  bindMonth();
}
function tile(label, valueHtml, sub, act, isCta) {
  var edit = owner() ? '<span class="t-edit">' + I.edit + 'Edit</span>' : '';
  var inner = '<span class="t-label"><span>' + esc(label) + '</span>' + edit + '</span>' +
    '<span class="t-value">' + (valueHtml === null ? 'Set balance' : valueHtml) + '</span>' +
    (sub ? '<span class="t-sub">' + sub + '</span>' : '');
  return owner()
    ? '<button class="tile ' + (isCta ? 'cta' : '') + '" data-act="' + act + '">' + inner + '</button>'
    : '<div class="tile">' + inner + '</div>';
}
function reserveTile(d) {
  var thisMonth = d.reserve ? (d.reserve > 0 ? '+' : '−') + fmtNumMasked(Math.abs(d.reserve), true) + ' in ' + esc(monthLabel(d.month)) : 'nothing set aside in ' + esc(monthLabel(d.month));
  var edit = owner() ? '<span class="t-edit">' + I.edit + 'Edit</span>' : '';
  var inner = '<span class="t-label"><span>Reserve · kept aside</span>' + edit + '</span>' +
    '<span class="t-row"><span class="t-value">' + money(d.reserveTotal, true) + '</span><span class="t-sub">' + thisMonth + '</span></span>';
  return owner() ? '<button class="tile wide" data-act="reserve">' + inner + '</button>' : '<div class="tile wide">' + inner + '</div>';
}
function fmtNumMasked(v, sens) { return isMasked(sens) ? '••••' : (CUR ? CUR + ' ' : '') + fmtNum(v); }
function amtLabel(base) { return base + (CUR ? ' (' + CUR + ')' : ''); }
function itemRow(i) {
  var paid = i.status === 'paid';
  var sub = paid ? 'Paid ' + dateLabel(i.paid_on) : (i.source === 'recurring' ? 'Recurring' : 'One-off');
  if (i.notes) sub += ' · ' + esc(i.notes);
  var tick = owner()
    ? '<button class="tick ' + (paid ? 'done' : '') + '" data-pay="' + esc(i.id) + '" aria-label="' + (paid ? 'Mark as not paid' : 'Mark paid') + '">' + (paid ? I.check : '') + '</button>'
    : '<span class="tick ' + (paid ? 'done' : '') + '">' + (paid ? I.check : '') + '</span>';
  return '<div class="row ' + (paid ? 'paid' : '') + '">' + tick +
    '<span class="avatar" style="background:' + catColor(i.category) + '">' + esc(initial(i.name)) + '</span>' +
    '<div class="row-main"><div class="row-name">' + esc(i.name) + '</div><div class="row-sub">' + sub + '</div></div>' +
    '<div class="row-amt">' + money(i.amount) + '</div>' +
    (owner() ? '<button class="more" data-menu="' + esc(i.id) + '" aria-label="More">' + I.dots + '</button>' : '') + '</div>';
}
function bindMonth() {
  $$('[data-nav]').forEach(function (b) { b.addEventListener('click', function () {
    var n = Number(b.getAttribute('data-nav'));
    S.month = n === 0 ? S.boot.currentMonth : monthAdd(S.month, n);
    load();
  }); });
  $$('[data-group]').forEach(function (b) { b.addEventListener('click', function () {
    var g = b.getAttribute('data-group');
    if (g === '__paid') S.paidOpen = !S.paidOpen; else S.collapsed[g] = !S.collapsed[g];
    renderMonth();
  }); });
  $$('[data-pay]').forEach(function (b) { b.addEventListener('click', function () { togglePaid(b.getAttribute('data-pay')); }); });
  $$('[data-menu]').forEach(function (b) { b.addEventListener('click', function () { itemMenu(findItem(b.getAttribute('data-menu'))); }); });
  var bal = $('[data-act="balance"]'); if (bal) bal.addEventListener('click', editBalance);
  var sal = $('[data-act="salary"]'); if (sal) sal.addEventListener('click', editSalary);
  var res = $('[data-act="reserve"]'); if (res) res.addEventListener('click', editReserve);
  var add = $('[data-act="add"]'); if (add) add.addEventListener('click', onFab);
}
function findItem(id) {
  var pools = [S.data.month && S.data.month.items, S.data.planned].filter(Boolean);
  for (var p = 0; p < pools.length; p++) for (var i = 0; i < pools[p].length; i++) if (pools[p][i].id === id) return pools[p][i];
  return null;
}
function togglePaid(id) {
  var it = findItem(id); if (!it) return;
  var paid = it.status !== 'paid';
  // Optimistic update.
  it.status = paid ? 'paid' : 'pending'; it.paid_on = paid ? S.boot.today : '';
  recalcMonth(); render();
  api('markPaid', id, paid).then(function () {
    invalidate();
    toast((paid ? 'Marked paid: ' : 'Back to pending: ') + it.name, { label: 'Undo', fn: function () { togglePaid(id); } });
  }).catch(function (e) { showError(e); load(); });
}
function recalcMonth() {
  var d = S.data.month; if (!d) return;
  var p = 0, q = 0;
  d.items.forEach(function (i) { if (i.status === 'paid') q += i.amount; else p += i.amount; });
  d.totals = { pending: p, paid: q }; d.left = d.balance === null ? null : d.balance - p - (d.reserveTotal || 0);
}

/* ------------------------------------------------------------------ item actions */
function itemMenu(it) {
  if (!it) return;
  var h = '<h2>' + esc(it.name) + '</h2><p class="hint">' + money(it.amount) + ' · ' + esc(monthLabel(it.month)) + (it.status === 'paid' ? ' · paid ' + esc(dateLabel(it.paid_on)) : '') + '</p><div class="menu">';
  h += '<button data-m="edit">' + I.edit + 'Edit</button>';
  h += '<button data-m="move">' + I.move + 'Move to another month</button>';
  if (it.template) h += '<button data-m="stop">' + I.stop + 'Stop this bill after ' + esc(monthLabel(it.month)) + '</button>';
  h += '<button data-m="delete" class="danger">' + I.trash + 'Delete from ' + esc(monthLabel(it.month)) + ' only</button>';
  h += '</div>';
  openSheet(h, function (root) {
    $('[data-m="edit"]', root).addEventListener('click', function () { editItem(it); });
    $('[data-m="move"]', root).addEventListener('click', function () { moveItem(it); });
    var st = $('[data-m="stop"]', root); if (st) st.addEventListener('click', function () { stopTemplate(it.template, it.name, it.month); });
    $('[data-m="delete"]', root).addEventListener('click', function () { confirmDelete(it); });
  });
}
function monthOptions(selected, extra) {
  var base = S.boot.currentMonth, out = [];
  for (var i = -3; i <= 24; i++) out.push(monthAdd(base, i));
  [selected, extra].forEach(function (m) { if (m && out.indexOf(m) < 0) out.push(m); });
  out.sort();
  return out.map(function (m) { return { value: m, label: monthLabel(m) }; });
}
function openAddItem(defaults) {
  defaults = defaults || {};
  formSheet({
    title: 'Add expense',
    fields: [
      { name: 'name', label: 'Name', type: 'text', required: true, autofocus: true, placeholder: 'e.g. Car service' },
      { name: 'amount', label: amtLabel('Amount'), type: 'number', required: true },
      { name: 'category', label: 'Category', type: 'select', value: defaults.category || catOr('Other', CATS.length - 2), options: CATS.map(function (c) { return { value: c, label: c }; }) },
      { name: 'month', label: 'Month', type: 'select', value: defaults.month || S.month, options: monthOptions(defaults.month || S.month) },
      { name: 'repeat', label: 'Repeats', type: 'select', value: '0', options: [{ value: '0', label: 'Does not repeat' }, { value: '1', label: 'Every month' }, { value: '2', label: 'Every 2 months' }, { value: '3', label: 'Every 3 months' }, { value: '4', label: 'Every 4 months' }, { value: '6', label: 'Every 6 months' }, { value: '12', label: 'Every year' }] },
      { name: 'notes', label: 'Notes (optional)', type: 'text' }
    ],
    submit: 'Add',
    onSubmit: function (v) {
      var payload = { name: v.name, amount: v.amount, category: v.category, month: v.month, notes: v.notes };
      if (Number(v.repeat) > 0) payload.recurring = { every_n_months: Number(v.repeat) };
      return api('addItem', payload).then(function () {
        invalidate(); S.data.recurring = null;
        toast('Added ' + v.name + ' to ' + monthLabel(v.month));
        if (S.tab === 'month' && v.month !== S.month) { S.month = v.month; }
        load();
      });
    }
  });
}
function editItem(it) {
  formSheet({
    title: 'Edit expense',
    fields: [
      { name: 'name', label: 'Name', type: 'text', required: true, value: it.name },
      { name: 'amount', label: amtLabel('Amount'), type: 'number', required: true, value: it.amount },
      { name: 'category', label: 'Category', type: 'select', value: it.category, options: CATS.map(function (c) { return { value: c, label: c }; }) },
      { name: 'notes', label: 'Notes (optional)', type: 'text', value: it.notes || '' }
    ],
    submit: 'Save',
    onSubmit: function (v) {
      return api('updateItem', it.id, v).then(function () { invalidate(); toast('Saved'); load(); });
    }
  });
}
function moveItem(it) {
  formSheet({
    title: 'Move ' + it.name,
    hint: 'Only this occurrence moves. Other months are not affected.',
    fields: [{ name: 'month', label: 'Move to', type: 'select', value: it.month, options: monthOptions(it.month) }],
    submit: 'Move',
    onSubmit: function (v) {
      return api('updateItem', it.id, { month: v.month }).then(function () { invalidate(); toast('Moved to ' + monthLabel(v.month)); load(); });
    }
  });
}
function confirmDelete(it) {
  openSheet('<h2>Delete ' + esc(it.name) + '?</h2><p class="hint">Removes it from ' + esc(monthLabel(it.month)) + ' only. ' + (it.template ? 'It will still appear in other months where it is due.' : '') + '</p>' +
    '<div class="btn-row"><button class="btn secondary" data-x="cancel">Cancel</button><button class="btn danger" data-x="ok">Delete</button></div>', function (root) {
    $('[data-x="cancel"]', root).addEventListener('click', closeSheet);
    $('[data-x="ok"]', root).addEventListener('click', function () {
      closeSheet();
      api('deleteItem', it.id).then(function () { invalidate(); toast('Deleted ' + it.name); load(); }).catch(showError);
    });
  });
}
function stopTemplate(templateId, name, lastMonth) {
  formSheet({
    title: 'Stop ' + name,
    hint: 'Choose the last month it applies. Earlier months keep their rows, paid or pending. Unpaid rows after that month are removed.',
    fields: [{ name: 'last', label: 'Last month', type: 'select', value: lastMonth, options: monthOptions(lastMonth) }],
    submit: 'Stop after this month',
    onSubmit: function (v) {
      return api('stopRecurring', templateId, v.last).then(function (r) {
        invalidate(); S.data.recurring = null;
        toast('Stopped ' + name + ' after ' + monthLabel(v.last) + (r.removed ? ' · removed ' + r.removed + ' upcoming' : ''));
        load();
      });
    }
  });
}
function editBalance() {
  var d = S.data.month;
  formSheet({
    title: 'Bank balance',
    hint: 'What your debit account shows right now. Left for expenses is this minus everything still pending.',
    fields: [{ name: 'balance', label: amtLabel('Balance'), type: 'number', value: d.balance === null ? '' : d.balance, autofocus: true, required: true }],
    submit: 'Save',
    onSubmit: function (v) { return api('setBalance', d.month, v.balance).then(function (nd) { S.data.month = nd; invalidate(); render(); toast('Balance updated'); }); }
  });
}
function editSalary() {
  var d = S.data.month;
  formSheet({
    title: 'Salary for ' + monthLabel(d.month),
    hint: 'Overrides the recurring salary for this month only.',
    fields: [{ name: 'salary', label: amtLabel('Salary'), type: 'number', value: d.salary === null ? '' : d.salary, autofocus: true, required: true }],
    submit: 'Save',
    onSubmit: function (v) { return api('setSalary', d.month, v.salary).then(function (nd) { S.data.month = nd; invalidate(); render(); toast('Salary updated'); }); }
  });
}
function editReserve() {
  var d = S.data.month;
  var before = d.reserveTotal - d.reserve;
  formSheet({
    title: 'Reserve for ' + monthLabel(d.month),
    hint: 'Money you keep in the account but do not spend. Kept aside before this month: ' + (CUR ? CUR + ' ' : '') + fmtNum(before) + '. Enter what you set aside this month; a negative number takes money back out.',
    fields: [{ name: 'amount', label: amtLabel('Set aside this month'), type: 'number', value: d.reserve || '', autofocus: true, allowNegative: true }],
    submit: 'Save',
    onSubmit: function (v) { return api('setReserve', d.month, v.amount === '' ? 0 : v.amount).then(function (nd) { S.data.month = nd; invalidate(); render(); toast('Reserve updated'); }); }
  });
}
function onFab() {
  if (S.tab === 'recurring') return editRecurring(null);
  if (S.tab === 'planned') return openAddItem({ category: catOr('Planned', CATS.length - 1), month: monthAdd(S.boot.currentMonth, 1) });
  openAddItem({ month: S.month });
}

/* ------------------------------------------------------------------ forecast */
function renderForecast() {
  var fc = S.data.forecast; if (!fc) return;
  var h = '<div class="seg"><button data-n="6" class="' + (S.fcCount === 6 ? 'on' : '') + '">6 months</button><button data-n="12" class="' + (S.fcCount === 12 ? 'on' : '') + '">12 months</button></div>';
  h += '<section class="card chart">' + chart(fc) + '<div class="legend"><span><i style="background:#16A34A"></i>In</span><span><i style="background:#F87171"></i>Out</span><span><i style="background:#6366F1"></i>Left after</span></div></section>';
  h += '<section class="card"><div class="fc-head"><span>Month</span><span>In</span><span>Out</span><span>Left after</span></div>';
  fc.forEach(function (m, idx) {
    var open = !!S.fcOpen[m.month];
    h += '<button class="fc-row" data-fc="' + esc(m.month) + '"><span class="m">' + esc(monthLabel(m.month)) + '<small>' + (m.expanded ? (idx === 0 ? 'balance − pending' : 'opened') : 'projected') + '</small></span>' +
         '<span>' + money(m.salary, true) + '</span><span>' + money(m.expenses) + '</span><span class="' + (isMasked(true) ? '' : m.running < 0 ? 'neg' : 'pos') + '">' + money(m.running, true) + '</span></button>';
    if (open) {
      h += '<div class="fc-detail">';
      CATS.forEach(function (c) { if (m.byCategory[c]) h += '<div class="line"><span class="n"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + catColor(c) + ';margin-right:6px"></span>' + esc(c) + '</span><span>' + money(m.byCategory[c]) + '</span></div>'; });
      m.items.forEach(function (i) { h += '<div class="line item"><span class="n">' + esc(i.name) + (i.status === 'paid' ? ' <span class="badge paid">paid</span>' : i.status === 'projected' ? ' <span class="badge proj">projected</span>' : '') + '</span><span>' + money(i.amount) + '</span></div>'; });
      if (m.reserve) h += '<div class="line"><span class="n">Set aside to reserve</span><span>' + money(m.reserve, true) + '</span></div>';
      h += '<div class="line total"><span>Net for the month</span><span class="' + (isMasked(true) ? '' : m.net < 0 ? 'neg' : 'pos') + '">' + money(m.net, true) + '</span></div></div>';
    }
  });
  h += '</section>';
  h += '<p style="font-size:12px;color:var(--faint);margin:4px 6px">"Left after" starts from this month\'s balance minus pending and minus the reserve, then adds each month\'s salary and subtracts its expenses and set-aside. Months not opened yet are projected from your recurring templates plus any planned items.</p>';
  $('#view').innerHTML = h;
  $$('[data-n]').forEach(function (b) { b.addEventListener('click', function () { S.fcCount = Number(b.getAttribute('data-n')); S.data.forecast = null; load(); }); });
  $$('[data-fc]').forEach(function (b) { b.addEventListener('click', function () { var k = b.getAttribute('data-fc'); S.fcOpen[k] = !S.fcOpen[k]; renderForecast(); }); });
}
function chart(fc) {
  var W = 76, H = 150, top = 14, bottom = 26, bw = 14, gap = 4;
  var maxV = 1;
  fc.forEach(function (m) { maxV = Math.max(maxV, m.salary, m.expenses, Math.abs(m.running)); });
  var width = fc.length * W;
  var hasNeg = fc.some(function (m) { return m.running < 0; });
  var zeroY = hasNeg ? top + (H - top - bottom) * 0.72 : H - bottom;
  var scale = (zeroY - top) / maxV;
  var negScale = hasNeg ? (H - bottom - zeroY) / maxV : 0;
  var s = '<div class="chart-scroll"><svg width="' + width + '" height="' + H + '" viewBox="0 0 ' + width + ' ' + H + '">';
  var allMask = isMasked(false), sensMask = isMasked(true);
  fc.forEach(function (m, i) {
    var x0 = i * W + (W - (3 * bw + 2 * gap)) / 2;
    function bar(x, v, color, masked) {
      if (masked) return '<rect x="' + x + '" y="' + (zeroY - 28) + '" width="' + bw + '" height="28" rx="4" fill="none" stroke="' + color + '" stroke-dasharray="3 3" opacity=".6"/>';
      if (v >= 0) { var hh = Math.max(2, v * scale); return '<rect x="' + x + '" y="' + (zeroY - hh) + '" width="' + bw + '" height="' + hh + '" rx="4" fill="' + color + '"/>'; }
      var nh = Math.max(2, -v * negScale); return '<rect x="' + x + '" y="' + zeroY + '" width="' + bw + '" height="' + nh + '" rx="4" fill="' + color + '" opacity=".85"/>';
    }
    s += bar(x0, m.salary, '#16A34A', sensMask);
    s += bar(x0 + bw + gap, m.expenses, '#F87171', allMask);
    s += bar(x0 + 2 * (bw + gap), m.running, m.running < 0 ? '#DC2626' : '#6366F1', sensMask);
    s += '<text x="' + (i * W + W / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="' + (i === 0 ? '700' : '500') + '">' + esc(monthShort(m.month)) + '</text>';
  });
  s += '<line x1="0" x2="' + width + '" y1="' + zeroY + '" y2="' + zeroY + '" stroke="#E5E7EB"/>';
  s += '</svg></div>';
  return s;
}

/* ------------------------------------------------------------------ planned */
function renderPlanned() {
  var list = S.data.planned; if (!list) return;
  var h = '';
  if (!list.length) {
    h = '<section class="card"><div class="empty"><strong>No planned expenses</strong>One-off things coming up: a fridge, a trip, a repair. They show up in the forecast for their month.' + (owner() ? '<br><button class="btn" data-act="add">Plan an expense</button>' : '') + '</div></section>';
  } else {
    var groups = {};
    list.forEach(function (i) { (groups[i.month] = groups[i.month] || []).push(i); });
    var total = list.reduce(function (a, i) { return a + i.amount; }, 0);
    h += '<section class="card card-pad" style="display:flex;justify-content:space-between;align-items:center"><div><div class="stat-label">Planned, not yet paid</div><div class="stat-value">' + money(total) + '</div></div><div class="stat-sub">' + list.length + ' item' + (list.length === 1 ? '' : 's') + '</div></section>';
    Object.keys(groups).sort().forEach(function (m) {
      var sum = groups[m].reduce(function (a, i) { return a + i.amount; }, 0);
      h += '<section class="card"><div class="group-head" style="cursor:default"><span class="dot" style="background:' + (m === S.boot.currentMonth ? 'var(--good-strong)' : '#9CA3AF') + '"></span>' + esc(monthLabel(m)) + '<span class="amt">' + money(sum) + '</span></div><div class="rows">' + groups[m].map(itemRow).join('') + '</div></section>';
    });
  }
  $('#view').innerHTML = '<div class="section-title" style="margin-top:8px">Upcoming one-offs</div>' + h;
  $$('[data-pay]').forEach(function (b) { b.addEventListener('click', function () { togglePaid(b.getAttribute('data-pay')); }); });
  $$('[data-menu]').forEach(function (b) { b.addEventListener('click', function () { itemMenu(findItem(b.getAttribute('data-menu'))); }); });
  var add = $('[data-act="add"]'); if (add) add.addEventListener('click', onFab);
}

/* ------------------------------------------------------------------ recurring */
function renderRecurring() {
  var list = S.data.recurring; if (!list) return;
  var active = list.filter(function (t) { return t.active === 'yes'; });
  var off = list.filter(function (t) { return t.active !== 'yes'; });
  var h = '<div class="section-title" style="margin-top:8px">Active</div><section class="card">';
  if (!active.length) h += '<div class="empty">No recurring items yet.</div>';
  h += active.map(recRow).join('') + '</section>';
  if (off.length) h += '<div class="section-title">Switched off</div><section class="card">' + off.map(recRow).join('') + '</section>';
  h += '<p style="font-size:12px;color:var(--faint);margin:4px 6px">Each month is filled in from these the first time you open it. Editing a template never changes months already paid. Categories and currency live in the Settings tab of the spreadsheet.</p>';
  $('#view').innerHTML = h;
  $$('[data-rec]').forEach(function (b) { b.addEventListener('click', function () {
    var t = list.filter(function (x) { return x.id === b.getAttribute('data-rec'); })[0];
    if (owner()) editRecurring(t);
  }); });
}
function recRow(t) {
  var when = repeatLabel(t.every_n_months) + ' · from ' + monthLabel(t.start_month) + (t.end_month ? ' until ' + monthLabel(t.end_month) : '');
  var isIncome = t.category === 'Income';
  return '<button class="row ' + (t.active === 'yes' ? '' : 'off') + '" data-rec="' + esc(t.id) + '" style="width:100%;text-align:left">' +
    '<span class="avatar" style="background:' + catColor(t.category) + '">' + (isIncome ? '↓' : esc(initial(t.name))) + '</span>' +
    '<div class="row-main"><div class="row-name">' + esc(t.name) + ' <span class="chip" style="background:' + catColor(t.category) + ';vertical-align:1px">' + esc(t.category) + '</span></div><div class="row-sub">' + esc(when) + '</div></div>' +
    '<div class="row-amt">' + money(t.amount, isIncome) + '</div>' + (owner() ? '<span class="more">' + I.dots + '</span>' : '') + '</button>';
}
function editRecurring(t) {
  var isNew = !t;
  var cats = CATS.concat(['Income']).map(function (c) { return { value: c, label: c === 'Income' ? 'Income (salary)' : c }; });
  var fields = [
    { name: 'name', label: 'Name', type: 'text', required: true, value: t ? t.name : '', autofocus: isNew },
    { name: 'amount', label: amtLabel('Amount'), type: 'number', required: true, value: t ? t.amount : '' },
    { name: 'category', label: 'Category', type: 'select', value: t ? t.category : catOr('Bills', 0), options: cats },
    { name: 'every_n_months', label: 'Repeats', type: 'select', value: t ? String(t.every_n_months) : '1', options: [1, 2, 3, 4, 6, 12].map(function (n) { return { value: String(n), label: repeatLabel(n) }; }) },
    { name: 'start_month', label: 'First month', type: 'select', value: t ? t.start_month : S.boot.currentMonth, options: monthOptions(t ? t.start_month : null) },
    { name: 'end_month', label: 'Last month', type: 'select', value: t && t.end_month ? t.end_month : '', options: [{ value: '', label: 'No end' }].concat(monthOptions(t ? t.end_month : null)) }
  ];
  if (!isNew) {
    fields.push({ name: 'active', label: 'Active', type: 'check', value: t.active === 'yes' });
    fields.push({ name: 'apply', label: 'Update unpaid rows from this month onward', type: 'check', value: true });
  }
  formSheet({
    title: isNew ? 'New recurring item' : 'Edit ' + t.name,
    hint: isNew ? 'It will be added to months you have already opened where it is due, and to future months as you open them.' : 'Paid rows are never changed.',
    fields: fields,
    submit: isNew ? 'Create' : 'Save',
    extra: isNew ? '' : '<button class="btn danger block" type="button" data-x="stop" style="margin-top:8px">' + I.stop + ' Stop after a month…</button>',
    bind: function (root) {
      var st = $('[data-x="stop"]', root); if (st) st.addEventListener('click', function () { stopTemplate(t.id, t.name, S.boot.currentMonth); });
    },
    onSubmit: function (v) {
      var payload = { id: t ? t.id : '', name: v.name, amount: v.amount, category: v.category, every_n_months: v.every_n_months, start_month: v.start_month, end_month: v.end_month, active: isNew || v.active ? 'yes' : 'no' };
      return api('saveRecurring', payload, { applyToPending: !!v.apply }).then(function () {
        S.data.recurring = null; S.data.month = null; invalidate();
        toast(isNew ? 'Created ' + v.name : 'Saved ' + v.name);
        load();
      });
    }
  });
}

/* ------------------------------------------------------------------ sheet + forms */
function openSheet(html, bind, opts) {
  closeSheet();
  var host = $('#sheetHost');
  host.innerHTML = '<div class="backdrop"><div class="sheet" role="dialog"><div class="handle"></div>' + html + '</div></div>';
  var back = $('.backdrop', host);
  if (!(opts && opts.modal)) {
    back.addEventListener('click', function (e) { if (e.target === back) closeSheet(); });
    document.addEventListener('keydown', escClose);
  }
  if (bind) bind($('.sheet', host));
}
function escClose(e) { if (e.key === 'Escape') closeSheet(); }
function closeSheet() { $('#sheetHost').innerHTML = ''; document.removeEventListener('keydown', escClose); }
function formSheet(cfg) {
  var h = '<h2>' + esc(cfg.title) + '</h2>' + (cfg.hint ? '<p class="hint">' + esc(cfg.hint) + '</p>' : '') + '<form novalidate>';
  cfg.fields.forEach(function (f) {
    if (f.type === 'check') { h += '<div class="field check"><input type="checkbox" id="f_' + f.name + '" name="' + f.name + '" ' + (f.value ? 'checked' : '') + '><label for="f_' + f.name + '">' + esc(f.label) + '</label></div>'; return; }
    h += '<div class="field"><label for="f_' + f.name + '">' + esc(f.label) + '</label>';
    if (f.type === 'select') {
      h += '<select id="f_' + f.name + '" name="' + f.name + '">' + f.options.map(function (o) { return '<option value="' + esc(o.value) + '" ' + (String(o.value) === String(f.value) ? 'selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select>';
    } else if (f.type === 'number') {
      h += '<input type="number" inputmode="decimal" step="any" ' + (f.allowNegative ? '' : 'min="0"') + ' id="f_' + f.name + '" name="' + f.name + '" value="' + esc(f.value == null ? '' : f.value) + '" ' + (f.required ? 'required' : '') + ' ' + (f.autofocus ? 'autofocus' : '') + '>';
    } else {
      h += '<input type="text" id="f_' + f.name + '" name="' + f.name + '" value="' + esc(f.value == null ? '' : f.value) + '" placeholder="' + esc(f.placeholder || '') + '" ' + (f.required ? 'required' : '') + ' ' + (f.autofocus ? 'autofocus' : '') + '>';
    }
    h += '</div>';
  });
  h += '<div class="btn-row">' + (cfg.noCancel ? '' : '<button class="btn secondary" type="button" data-x="cancel">Cancel</button>') + '<button class="btn" type="submit">' + esc(cfg.submit || 'Save') + '</button></div>' + (cfg.extra || '') + '</form>';
  openSheet(h, function (root) {
    var form = $('form', root);
    var cancel = $('[data-x="cancel"]', root); if (cancel) cancel.addEventListener('click', closeSheet);
    if (cfg.bind) cfg.bind(root);
    var af = $('[autofocus]', root); if (af) setTimeout(function () { af.focus(); }, 50);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = {};
      cfg.fields.forEach(function (f) { var el = $('[name="' + f.name + '"]', form); v[f.name] = f.type === 'check' ? el.checked : el.value.trim(); });
      for (var i = 0; i < cfg.fields.length; i++) {
        var f = cfg.fields[i];
        if (f.required && !v[f.name]) { $('[name="' + f.name + '"]', form).focus(); return; }
        if (f.type === 'number' && v[f.name] !== '' && (isNaN(Number(v[f.name])) || (!f.allowNegative && Number(v[f.name]) < 0))) { $('[name="' + f.name + '"]', form).focus(); return; }
      }
      var btn = $('[type="submit"]', form); btn.disabled = true;
      Promise.resolve(cfg.onSubmit(v)).then(closeSheet).catch(function (err) { btn.disabled = false; showError(err); });
    });
  }, { modal: !!cfg.noCancel });
}

/* ------------------------------------------------------------------ toast */
var toastTimer = null;
function toast(msg, action) {
  var host = $('#toastHost');
  host.innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' + (action ? '<button>' + esc(action.label) + '</button>' : '') + '</div>';
  if (action) $('button', host).addEventListener('click', function () { host.innerHTML = ''; action.fn(); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { host.innerHTML = ''; }, action ? 6000 : 3500);
}

init();
</script>
</body>
</html>
