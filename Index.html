<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Money Panel</title>
<style>
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --text:#111827; --muted:#6B7280; --faint:#9CA3AF; --body:#4B5563;
  --border:#EAECEF; --hairline:#F1F2F4; --soft:#FAFAFB; --soft2:#FCFCFD; --disabled:#D0D5DD; --chevron:#C4C7CE;
  --good:#15803D; --good-bg:#ECFDF3; --good-strong:#16A34A;
  --bad:#B42318; --bad-bg:#FEF3F2;
  --info:#4338CA; --info-bg:#EEF2FF;
  --warn:#B54708; --warn-dot:#F59E0B;
  --accent:#111827; --select-bg:#F5F8FF;
  --radius-card:20px; --radius-ctl:12px; --radius-pill:999px;
  --shadow:0 1px 2px rgba(16,24,40,.04); --shadow-fab:0 10px 24px rgba(17,24,39,.28);
  --c-income:#16A34A;
  --tabbar:72px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
svg{display:inline-block;vertical-align:middle}

/* ---- shell ---- */
.shell{display:block}
.rail{display:none}
.page{max-width:520px;margin:0 auto;padding:0 16px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom));min-height:100vh}
.dk{display:none!important}
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:40;overflow:hidden;pointer-events:none}
.progress.on::after{content:"";display:block;height:100%;width:40%;background:var(--accent);animation:slide 1s infinite linear;border-radius:2px}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* ---- header ---- */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 14px}
.hdr-title{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.1;display:inline-flex;align-items:center;gap:6px}
.hdr-title svg{width:17px;height:17px;color:var(--faint)}
.hdr-sub{font-size:13px;color:var(--muted);margin-top:2px}
.hdr-right{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.ctl{height:44px;min-width:44px;border-radius:14px;background:#fff;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);padding:0 12px;font-size:13.5px;font-weight:600}
.ctl svg{width:21px;height:21px}
.ctl.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ctl.sm{height:38px;min-width:38px;border-radius:11px;padding:0 10px;color:var(--text)}
.ctl.sm svg{width:18px;height:18px}
.private-strip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 14px;font-size:12.5px;color:var(--body);margin-bottom:12px}
.private-strip svg{width:17px;height:17px;color:var(--muted);flex:0 0 auto}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.pill{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:var(--radius-pill);white-space:nowrap}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;line-height:1.5}
.chip.good{color:var(--good);background:var(--good-bg)}
.chip.bad{color:var(--bad);background:var(--bad-bg)}
.chip.info{color:var(--info);background:var(--info-bg)}
.chip.neutral{color:var(--muted);background:#F4F5F7}
.chip.delta{font-size:12px;padding:4px 9px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:var(--radius-pill);margin-left:6px;vertical-align:1px}
.tag.oneoff{color:var(--muted);background:#F4F5F7}
.tag.every{color:var(--info);background:var(--info-bg)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.masked{color:var(--disabled);font-weight:700;letter-spacing:.06em}
.cur{font-size:.6em;font-weight:600;color:var(--faint);letter-spacing:0;margin-right:6px}

/* ---- hero ---- */
.hero{padding:18px 18px 14px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-label{font-size:13px;font-weight:600;color:var(--muted)}
.hero-amt{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:6px 0 2px}
.hero-amt .cur{font-size:16px;vertical-align:6px}
.hero-amt .masked{letter-spacing:.02em}
.hero-amt.unset{font-size:22px;letter-spacing:-.01em;margin:10px 0 4px}
.hero-amt.unset button{text-decoration:underline;text-underline-offset:3px}
.pace{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.pace b{font-size:14px;font-weight:600}
.pace span{font-size:13.5px;color:var(--muted)}
.pace .chip{margin-left:auto}
.hero-div{height:1px;background:var(--hairline);margin:14px -18px 12px}
.glance-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.glance-row b{font-weight:600}
.glance-row .r{font-size:12px;color:var(--faint)}
.stack{display:flex;gap:3px;height:10px;border-radius:var(--radius-pill);background:var(--hairline);margin-top:8px;overflow:hidden}
.stack i{display:block;height:100%;border-radius:var(--radius-pill);min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.legend button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:4px 6px;margin:-4px -6px;border-radius:8px;min-height:32px}
.legend button b{color:var(--text);font-weight:600}
.legend button .dot{width:8px;height:8px}
.legend button.on{background:var(--accent);color:#fff;margin:-4px 0}
.legend button.on b{color:#fff}

/* ---- money strip ---- */
.strip{display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:16px}
.cell{padding:13px 12px 12px;border-left:1px solid var(--hairline);min-height:44px;display:flex;flex-direction:column;position:relative;width:100%}
.cell:first-child{border-left:0}
.cell-label{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.cell-label svg{width:14px;height:14px;color:var(--chevron)}
.cell-value{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-sub{font-size:11.5px;color:var(--faint);margin-top:2px;display:flex;align-items:center;gap:5px}
.cell-sub.stale{color:var(--warn)}
.cell-sub .dot{width:6px;height:6px;background:var(--warn-dot)}
button.cell:hover{background:var(--soft)}

/* ---- bills ---- */
.bills-head{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.bills-head h2{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0}
.bills-head .sub{font-size:13px;color:var(--muted);margin-right:auto}
.btn-pill{font-size:12.5px;font-weight:600;background:#fff;border:1px solid var(--border);padding:7px 11px;border-radius:var(--radius-pill);min-height:34px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.group{margin-bottom:10px}
.ghead{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--soft);font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.ghead .n{font-weight:500;color:var(--faint);letter-spacing:0}
.ghead .t{margin-left:auto;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.ghead.overdue{background:var(--bad-bg);color:var(--bad)}
.ghead.overdue .n{color:var(--bad);opacity:.8}
.ghead.overdue .t{color:var(--bad)}
.bill{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--hairline);width:100%;position:relative}
.group .bill:first-child,.ghead + .bill{border-top:0}
.bill.selected{background:var(--select-bg)}
.bill.paid .bill-name,.bill.paid .bill-amt{color:var(--muted);font-weight:500}
.bill.fading{transition:opacity .16s;opacity:.4}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--disabled);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;color:#fff;position:relative;transition:background .12s,border-color .12s}
.tick::before{content:"";position:absolute;inset:-9px}
.tick svg{width:14px;height:14px}
.tick.done{background:var(--good-strong);border-color:var(--good-strong)}
.tick.sel{background:var(--accent);border-color:var(--accent)}
button.tick:hover{border-color:var(--good-strong)}
.bill-main{flex:1;min-width:0}
.bill-name{font-size:15.5px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;min-width:0}
.bill-name .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-meta{font-size:12.5px;color:var(--muted);margin-top:2px;margin-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-meta.late{color:var(--bad)}
.bill-meta.nodate{color:var(--faint)}
.bill-amt{font-size:16px;font-weight:600;white-space:nowrap}
.more{width:32px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--chevron);margin:-10px -8px -10px -6px;flex:0 0 auto}
.more svg{width:16px;height:16px}
.more:hover{color:var(--text)}
.paid-row{display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%}
.paid-row .pc{width:22px;height:22px;border-radius:50%;background:var(--good-strong);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.paid-row .pc svg{width:12px;height:12px}
.paid-row .pt{font-size:14px;font-weight:600}
.paid-row .pn{font-size:13px;color:var(--faint)}
.paid-row .pa{margin-left:auto;font-size:14px;font-weight:600;color:var(--muted)}
.paid-row .chev{width:16px;height:16px;color:var(--chevron);transition:transform .15s}
.paid-row.open .chev{transform:rotate(90deg)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--text);margin-bottom:4px;font-size:15px}

/* ---- select mode ---- */
.selbar{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.selbar h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0;margin-right:auto}
.selbar .lnk{font-size:13.5px;font-weight:600;color:var(--muted);min-height:44px;display:inline-flex;align-items:center}
.selbar .cancel{font-size:13.5px;font-weight:600;background:#fff;border:1px solid var(--border);padding:8px 12px;border-radius:var(--radius-pill);min-height:38px}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:14px 16px calc(16px + env(safe-area-inset-bottom));z-index:30}
.actionbar .in{max-width:520px;margin:0 auto}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:15px;font-size:15.5px;font-weight:600}
.btn-primary svg{width:18px;height:18px}
.btn-primary[disabled]{opacity:.45;cursor:default}
.actionbar .cap{text-align:center;font-size:12.5px;color:var(--faint);margin-top:8px}
body.selecting .tabbar,body.selecting .fab{display:none!important}

/* ---- tab bar + fab ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:8px 10px calc(10px + env(safe-area-inset-bottom));z-index:20}
.tabbar .in{max-width:520px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--faint);font-weight:400;padding:4px 0;min-height:44px;justify-content:center}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--text);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;box-shadow:var(--shadow-fab);display:inline-flex;align-items:center;justify-content:center;z-index:20}
.fab svg{width:26px;height:26px}

/* ---- ahead ---- */
.seg{display:inline-flex;background:var(--border);padding:3px;border-radius:12px;gap:2px;margin:0 0 12px}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);min-height:34px}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.06);font-weight:600}
.sum{padding:18px 18px 10px}
.sum-label{font-size:13px;font-weight:600;color:var(--muted)}
.sum-amt{font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:4px 0 4px}
.sum-amt .cur{font-size:15px;vertical-align:5px}
.sum-note{font-size:13px;color:var(--muted)}
.sum-note b{color:var(--text);font-weight:600}
.linechart{width:100%;height:auto;display:block;margin-top:8px}
.mrow{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--hairline);width:100%}
.mrow:first-child{border-top:0}
.mrow-main{flex:1;min-width:0}
.mrow-name{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.mrow-sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.mrow-right{text-align:right;flex:0 0 auto}
.mrow-val{font-size:19px;font-weight:700;letter-spacing:-.02em}
.mrow-d{font-size:11.5px;color:var(--faint);margin-top:1px}
.mrow-d.good{color:var(--good);font-weight:600}
.mrow-d.bad{color:var(--bad);font-weight:600}
.mrow .chev{width:16px;height:16px;color:var(--chevron);transition:transform .15s;flex:0 0 auto}
.mrow.open .chev{transform:rotate(180deg)}
.mdetail{background:var(--soft2);padding:2px 16px 14px;border-top:1px solid var(--hairline)}
.mline{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hairline);font-size:13px}
.mline:first-child{border-top:0}
.mline .nm{color:var(--body);width:64px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mline .bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.mline .bar i{display:block;height:100%;border-radius:3px}
.mline .am{font-weight:600;width:64px;text-align:right;flex:0 0 auto}
.mnote{font-size:12px;color:var(--faint);margin-top:10px}
.oneoffs{display:flex;align-items:center;gap:12px;padding:14px 16px}
.oneoffs .t{font-size:14px;font-weight:600}
.oneoffs .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.oneoffs .btn-pill{margin-left:auto;background:#F4F5F7;border-color:#F4F5F7}
.item-chip{display:inline-flex;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;line-height:1.6}

/* ---- plan ---- */
.income{display:flex;align-items:center;gap:12px;padding:14px 16px}
.income .ic{width:38px;height:38px;border-radius:13px;background:var(--good-bg);color:var(--good);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.income .ic svg{width:19px;height:19px}
.income .t{font-size:15.5px;font-weight:600}
.income .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.income .v{margin-left:auto;text-align:right}
.income .v b{font-size:17px;font-weight:700;color:var(--good);display:block}
.income .v span{font-size:11.5px;color:var(--faint)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sec span{font-weight:400;color:var(--faint);text-transform:none;letter-spacing:0}
.trow{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--hairline);width:100%}
.trow:first-child{border-top:0}
.trow.off{opacity:.55}
.trow-main{flex:1;min-width:0}
.trow-name{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.trow-name .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow-sub{font-size:12.5px;color:var(--muted);margin-top:2px;margin-left:15px}
.trow-amt{font-size:16px;font-weight:600}
.trow .chev{width:16px;height:16px;color:var(--chevron)}
.rule{padding:16px}
.rule h3{font-size:15px;font-weight:600;margin:0 0 4px}
.rule p{font-size:12.5px;color:var(--muted);margin:0}
.rule-stats{display:flex;align-items:center;gap:18px;border-top:1px solid var(--hairline);margin-top:14px;padding-top:12px}
.rule-stats .st b{display:block;font-size:18px;font-weight:700;margin-top:2px}
.rule-stats .st span{font-size:11.5px;font-weight:600;color:var(--muted)}
.rule-stats .btn-pill{margin-left:auto}
.btn-block{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:#fff;border-radius:16px;padding:14px;font-size:15px;font-weight:600;margin:14px 0 10px}
.btn-block svg{width:18px;height:18px}
.foot{font-size:12px;color:var(--faint);margin:0 4px 16px}

/* ---- sheet / forms / toast ---- */
.backdrop{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:4px auto 14px}
.sheet h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.sheet p.hint{margin:0 0 14px;color:var(--muted);font-size:13px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--soft);font-size:16px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent);background:#fff}
.field.check{display:flex;align-items:center;gap:10px;min-height:44px}
.field.check label{margin:0;color:var(--text);font-weight:500;font-size:14px}
.field.check input{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--accent);color:#fff;min-height:44px}
.btn.secondary{background:var(--bg);color:var(--text)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;margin-top:6px}
.btn-row .btn{flex:1}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:12px;font-weight:600;background:var(--bg);min-height:44px;width:100%}
.menu button.danger{color:var(--bad)}
.menu button svg{width:18px;height:18px;color:var(--muted)}
.menu button.danger svg{color:var(--bad)}
.menu button .now{margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1F2937;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.toast button{color:#86EFAC;font-weight:700;min-height:32px}
.setup{padding:24px;text-align:center}

/* ---- ≥760: wider column ---- */
@media(min-width:760px){
  .page{max-width:640px}
  .actionbar .in,.tabbar .in{max-width:640px}
}

/* ---- ≥1080: rail layout ---- */
@media(min-width:1080px){
  .dk{display:revert!important}
  .ph{display:none!important}
  .shell{display:flex;min-height:100vh}

<body>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="content"><div class="page" id="view"></div></main>
</div>
<nav class="tabbar" id="tabbar"><div class="in"></div></nav>
<button class="fab hidden" id="fab" aria-label="Add"></button>
<div id="actionHost"></div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
/* ------------------------------------------------------------------ icons */
var I = {
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',

  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  chevR: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 8l8 8M16 8l-8 8"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
  tMonth: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M8 14l3 3 5-5"/></svg>',
  tForecast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M8 15v-4M12 15V8M16 15v-6"/></svg>',
  tRecurring: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>'
};

/* ------------------------------------------------------------------ state */
var CATS = [];
var CUR = '';
var PALETTE = ['#6366F1', '#0EA5E9', '#F59E0B', '#10B981', '#8B5CF6', '#EC4899', '#14B8A6', '#F97316', '#64748B'];
var CHIP_TINT = { Travel: ['#047857', '#ECFDF5'], Planned: ['#BE185D', '#FDF2F8'], Other: ['#5B21B6', '#F5F3FF'] };
var TABS = [
  { id: 'month', label: 'This month', icon: I.tMonth },
  { id: 'ahead', label: 'Ahead', icon: I.tForecast },
  { id: 'plan', label: 'Plan', icon: I.tRecurring }
];
var TAB_ALIAS = { forecast: 'ahead', planned: 'ahead', recurring: 'plan' };
var S = {
  boot: null, tab: 'month', month: null, fcCount: 6,
  data: { month: null, forecast: null, plan: null },
  mask: { all: false },
  select: { on: false, ids: {} },
  filterCat: null, paidOpen: false, fcOpen: {}, busy: 0, lastRead: null
};
try {
  var saved = JSON.parse(localStorage.getItem('budget.mask') || '{}');
  S.mask.all = !!(saved.all || saved.sens); // fail safe: any previous masking stays masked
} catch (e) {}

/* ------------------------------------------------------------------ server */
function api(fn) {
  var args = [].slice.call(arguments, 1);
  busy(1);
  return new Promise(function (resolve, reject) {
    var runner = google.script.run
      .withSuccessHandler(function (r) { busy(-1); S.lastRead = new Date(); resolve(r); })
      .withFailureHandler(function (e) { busy(-1); reject(e && e.message ? e : new Error(String(e))); });
    runner[fn].apply(runner, args);
  });
}
function busy(d) { S.busy = Math.max(0, S.busy + d); $('#progress').classList.toggle('on', S.busy > 0); }

/* ------------------------------------------------------------------ helpers */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return [].slice.call((root || document).querySelectorAll(sel)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var DAYS_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function mp(m) { var p = m.split('-'); return { y: Number(p[0]), m: Number(p[1]) }; }
function monthLabel(m) { if (!m) return ''; var p = mp(m); return MONTHS[p.m - 1] + ' ' + p.y; }
function monthLong(m) { var p = mp(m); return MONTHS_LONG[p.m - 1]; }
function monthTitle(m) { var p = mp(m); var ty = mp(S.boot.currentMonth).y; return MONTHS_LONG[p.m - 1] + (p.y === ty ? '' : ' ' + p.y); }
function monthShort(m) { var p = mp(m); return MONTHS[p.m - 1] + (p.m === 1 ? ' ' + String(p.y).slice(2) : ''); }
function toDate(s) { var p = s.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2] || 1)); }
function dateLabel(d) { if (!d) return ''; var x = toDate(d); return x.getDate() + ' ' + MONTHS[x.getMonth()]; }
function dateLabelWd(d) { var x = toDate(d); return DAYS[x.getDay()] + ' ' + x.getDate() + ' ' + MONTHS[x.getMonth()]; }
function daysBetween(a, b) { return Math.round((toDate(b) - toDate(a)) / 86400000); }
function monthAdd(m, n) { var p = mp(m); var y = p.y, mo = p.m - 1 + n; y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12; return y + '-' + (mo + 1 < 10 ? '0' : '') + (mo + 1); }
function monthDiff(a, b) { var pa = mp(a), pb = mp(b); return (pb.y - pa.y) * 12 + (pb.m - pa.m); }
function lastDay(m) { var p = mp(m); return new Date(p.y, p.m, 0).getDate(); }
function fmtNum(n) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function masked() { return S.mask.all; }
/* money(v)          -> "USD 1,500" with the currency prefix (hero, section totals)
   money(v, 'bare')  -> "1,500" without the prefix (rows; the currency is stated once per section) */
function money(v, mode) {
  if (v === null || v === undefined || v === '') return '<span class="masked">—</span>';
  if (masked()) return '<span class="masked">' + (mode === 'bare' ? '•••' : '••••') + '</span>';
  var n = Number(v);
  return (n < 0 ? '−' : '') + (mode === 'bare' || !CUR ? '' : '<span class="cur">' + esc(CUR) + '</span>') + fmtNum(Math.abs(n));
}
function plain(v) { return masked() ? '••••' : (CUR ? CUR + ' ' : '') + fmtNum(v); }   // for text without markup
function bare(v) { return masked() ? '•••' : fmtNum(v); }
function signed(v) { return masked() ? '•••' : (v >= 0 ? '+' : '−') + fmtNum(Math.abs(v)); }
function catColor(c) { if (c === 'Income') return 'var(--c-income)'; var i = CATS.indexOf(c); return PALETTE[(i < 0 ? PALETTE.length - 1 : i) % PALETTE.length]; }
function catOr(name, fallbackIndex) { return CATS.indexOf(name) >= 0 ? name : CATS[Math.min(fallbackIndex, CATS.length - 1)]; }
function chipTint(c) { return CHIP_TINT[c] || ['#4338CA', '#EEF2FF']; }
function owner() { return !!(S.boot && S.boot.isOwner); }
function isDesktop() { return window.innerWidth >= 1080; }
function repeatLabel(n) { n = Number(n); return n === 1 ? 'Every month' : n === 12 ? 'Every year' : 'Every ' + n + ' months'; }
function pluralize(n, one, many) { return n + ' ' + (n === 1 ? one : many || one + 's'); }
function amtLabel(base) { return base + (CUR ? ' (' + CUR + ')' : ''); }

/* ------------------------------------------------------------------ boot */
function init() {
  renderChrome();
  $('#fab').innerHTML = I.plus;
  $('#fab').addEventListener('click', onFab);
  window.addEventListener('resize', onResize);
  api('getBootstrap').then(applyBoot).catch(showError);
}
var resizeTimer = null, wasDesktop = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    var d = isDesktop();
    if (wasDesktop !== null && d !== wasDesktop) { if (d && S.tab === 'month' && !S.data.forecast) loadForecastForMonth(); else render(); }
    wasDesktop = d;
  }, 120);
}
function applyBoot(b) {
  S.boot = b;
  S.month = b.currentMonth;
  CATS = b.categories || [];
  CUR = b.currency || '';
  wasDesktop = isDesktop();
  renderChrome();
  if (!b.ready || !b.configured) {
    if (b.isOwner) { $('#view').innerHTML = ''; welcome(); }
    else $('#view').innerHTML = '<div class="card setup"><h2>Not set up yet</h2><p>The owner of this panel has not finished setting it up. Ask them to open it once.</p></div>';
    return;
  }
  show('month');
}
function welcome() {
  formSheet({
    title: 'Welcome to Money Panel',
    hint: 'This is a monthly money plan, not a transaction tracker: salary in, bills out, what is left. You tick bills as you pay them. Three quick answers to start; everything can be changed later.',
    fields: [
      { name: 'currency', label: 'Currency code', type: 'text', required: true, placeholder: 'e.g. USD, EUR, GBP', autofocus: true },
      { name: 'salary', label: 'Monthly salary (optional)', type: 'number', placeholder: '0' },
      { name: 'balance', label: 'Bank balance right now (optional)', type: 'number', placeholder: '0' }
    ],
    submit: 'Start',
    noCancel: true,
    onSubmit: function (v) {
      return api('completeSetup', v).then(function (b) {
        S.data = { month: null, forecast: null, plan: null };
        applyBoot(b);
        toast('Ready. Add your bills in the Plan tab.');
      });
    }
  });
}
function setMask(on) {
  S.mask.all = !!on;
  try { localStorage.setItem('budget.mask', JSON.stringify({ all: S.mask.all })); } catch (e) {}
  renderChrome(); render();
}

/* ------------------------------------------------------------------ chrome: rail + tab bar */
function renderChrome() {
  var tabsHtml = TABS.map(function (t) { return '<button data-tab="' + t.id + '" class="' + (t.id === S.tab ? 'on' : '') + '">' + t.icon + '<span>' + t.label + '</span></button>'; }).join('');
  $('#tabbar .in').innerHTML = tabsHtml;
  var when = S.lastRead ? S.lastRead.getDate() + ' ' + MONTHS[S.lastRead.getMonth()] + ', ' + ('0' + S.lastRead.getHours()).slice(-2) + ':' + ('0' + S.lastRead.getMinutes()).slice(-2) : '—';
  $('#rail').innerHTML = '<div class="brand">Money Panel</div><nav>' + tabsHtml + '</nav>' +
    (owner() ? '<button class="btn-add" data-act="add">' + I.plus + 'Add an expense</button>' : '') +
    '<div class="bottom"><button class="privrow" data-act="mask">' + (masked() ? I.eyeOff : I.eye) + '<span class="lbl">' + (masked() ? 'Amounts hidden' : 'Amounts shown') + '</span><span class="toggle ' + (masked() ? '' : 'on') + '"></span></button>' +
    '<div class="note">Your sheet is the database. Last read ' + esc(when) + '.</div></div>';
  $$('[data-tab]').forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-tab')); }); });
  var add = $('#rail [data-act="add"]'); if (add) add.addEventListener('click', function () { openAddItem({ month: S.month }); });
  $('#rail [data-act="mask"]').addEventListener('click', function () { setMask(!masked()); });
}
function show(tab) {
  tab = TAB_ALIAS[tab] || tab;
  if (TABS.every(function (t) { return t.id !== tab; })) tab = 'month';
  exitSelect(false);
  S.tab = tab; S.filterCat = null;
  renderChrome();
  $('#fab').classList.toggle('hidden', !owner());
  window.scrollTo(0, 0);
  load();
}
function load() {
  var v = $('#view');
  if (S.tab === 'month') {
    if (!S.data.month || S.data.month.month !== S.month) v.innerHTML = skeleton();
    return api('getMonth', S.month).then(function (d) {
      S.data.month = d; render();
      if (isDesktop() && !S.data.forecast) loadForecastForMonth();
    }).catch(showError);
  }
  if (S.tab === 'ahead') {
    if (!S.data.forecast || S.data.forecast.length !== S.fcCount) v.innerHTML = skeleton();
    return api('getForecast', S.boot.currentMonth, S.fcCount).then(function (d) { S.data.forecast = d; render(); }).catch(showError);
  }
  if (!S.data.plan) v.innerHTML = skeleton();
  return api('getPlan').then(function (d) { S.data.plan = d; render(); }).catch(showError);
}
function loadForecastForMonth() {
  api('getForecast', S.boot.currentMonth, 6).then(function (d) { S.data.forecast = d; if (S.tab === 'month') render(); }).catch(function () {});
}
function invalidate() { S.data.forecast = null; S.data.plan = null; }

/* ------------------------------------------------------------------ this month */
function dueBucket(it, today) {

}
function dueMeta(it, today) {
  if (it.status === 'paid') return { text: 'Paid ' + dateLabel(it.paid_on), cls: '' };
  if (!it.due_on) return { text: 'no date set', cls: 'nodate' };
  var d = daysBetween(today, it.due_on);
  if (d < 0) return { text: pluralize(-d, 'day') + ' late · was due ' + dateLabel(it.due_on), short: pluralize(-d, 'day') + ' late · due ' + dateLabel(it.due_on), cls: 'late' };
  if (d === 0) return { text: 'due today', cls: '' };
  if (d <= 6) return { text: 'due ' + dateLabelWd(it.due_on), cls: '' };
  return { text: 'due ' + dateLabel(it.due_on), cls: '' };
}
function byDue(a, b) {
  if (!!a.due_on !== !!b.due_on) return a.due_on ? -1 : 1;
  if (a.due_on !== b.due_on) return a.due_on < b.due_on ? -1 : 1;
  return a.name.localeCompare(b.name);
}
function tagFor(it) {

  var t = templateFor(it.template);

}
function templateFor(id) {

  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];

}

function staleDays(d) { return d.balance_updated ? daysBetween(d.balance_updated, S.boot.today) : null; }

function renderRightCol(d, pending, paid, total, today) {

      '<div class="oo">' + (oneoffs.length ? oneoffs.map(itemChip).join('') + '<span>' + (oneoffs.length === 1 ? 'the only one-off booked' : pluralize(oneoffs.length, 'one-off') + ' booked') + '</span>' : '<span>no one-offs booked yet</span>') + '</div></section>';
  }
  return h;
}
function itemChip(i) {

function lineChart(fc) {

  function y(v) { return base - ((v - mn) / range) * (base - top); }
  var pts = vals.map(function (v, i) { return [x(i), y(v)]; });
  var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var area = path + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + base + ' L' + pts[0][0].toFixed(1) + ' ' + base + ' Z';
  var s = '<svg class="linechart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Running balance by month">';
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + base + '" y2="' + base + '" stroke="#EAECEF"/>';

  return s + '</svg>';
}

  h += '<div class="sec">Every month<span>' + plain(monthlyOut) + ' out</span></div><section class="card">';
  h += monthly.length ? monthly.map(function (t) { return trow(t, p); }).join('') : '<div class="empty">No monthly bills yet.</div>';
  h += '</section>';
  if (nowThen.length) {
    h += '<div class="sec">Now and then<span>' + pluralize(nowThen.length, 'template') + '</span></div><section class="card">' + nowThen.map(function (t) { return trow(t, p); }).join('') + '</section>';
  }
  var rule = p.reserveMonthly;
  h += '<section class="card rule"><h3>Reserve rule</h3><p>Money that stays in the account. It comes off safe-to-spend and the forecast keeps it aside every month.</p>' +
       '<div class="rule-stats"><div class="st"><span>Set aside each month</span><b>' + (rule === null || rule === undefined ? (masked() ? '•••' : 'not set') : money(rule, 'bare')) + '</b></div><div class="st"><span>Kept so far</span><b>' + money(p.reserveTotal, 'bare') + '</b></div>' +
       (owner() ? '<button class="btn-pill" data-act="rule">Change</button>' : '') + '</div></section>';
  if (owner()) h += '<button class="btn-block" data-act="newtpl">' + I.plus + 'New template</button>';
  h += '<p class="foot">Categories and currency live in the Settings tab of your sheet. Editing a template never changes a month you have already paid.</p>';
  if (off.length) h += '<div class="sec">Switched off</div><section class="card">' + off.map(function (t) { return trow(t, p); }).join('') + '</section>';
  $('#view').innerHTML = h;
  bindHeader();
  $$('[data-rec]').forEach(function (b) { b.addEventListener('click', function () { var t = p.templates.filter(function (x) { return x.id === b.getAttribute('data-rec'); })[0]; if (owner()) editRecurring(t); }); });
  var r = $('[data-act="rule"]'); if (r) r.addEventListener('click', editReserveRule);
  var n = $('[data-act="newtpl"]'); if (n) n.addEventListener('click', function () { editRecurring(null); });
}
function trow(t, p) {
  var multi = Number(t.every_n_months) > 1;
  var tag = owner() ? 'button' : 'div';
  return '<' + tag + ' class="trow ' + (t.active === 'yes' ? '' : 'off') + '" ' + (owner() ? 'data-rec="' + esc(t.id) + '"' : '') + '><div class="trow-main"><div class="trow-name"><i class="dot" style="background:' + catColor(t.category) + '"></i><span class="nm">' + esc(t.name) + '</span>' + (multi ? '<span class="tag every">every ' + t.every_n_months + ' mo</span>' : '') + '</div><div class="trow-sub">' + esc(occurrenceText(t, p)) + '</div></div><div class="trow-amt">' + money(t.amount, 'bare') + '</div>' + (owner() ? I.chevR : '') + '</' + tag + '>';
}
function editRecurring(t) {
  var isNew = !t;
  var cats = CATS.concat(['Income']).map(function (c) { return { value: c, label: c === 'Income' ? 'Income (salary)' : c }; });
  var fields = [
    { name: 'name', label: 'Name', type: 'text', required: true, value: t ? t.name : '', autofocus: isNew },
    { name: 'amount', label: amtLabel('Amount'), type: 'number', required: true, value: t ? t.amount : '' },
    { name: 'category', label: 'Category', type: 'select', value: t ? t.category : catOr('Bills', 0), options: cats },
    { name: 'every_n_months', label: 'Repeats', type: 'select', value: t ? String(t.every_n_months) : '1', options: [1, 2, 3, 4, 6, 12].map(function (n) { return { value: String(n), label: repeatLabel(n) }; }) },
    dueField(t && t.due_day ? t.due_day : ''),
    { name: 'start_month', label: 'First month', type: 'select', value: t ? t.start_month : S.boot.currentMonth, options: monthOptions(t ? t.start_month : null) },
    { name: 'end_month', label: 'Last month', type: 'select', value: t && t.end_month ? t.end_month : '', options: [{ value: '', label: 'No end' }].concat(monthOptions(t ? t.end_month : null)) }
  ];
  if (!isNew) {
    fields.push({ name: 'active', label: 'Active', type: 'check', value: t.active === 'yes' });
    fields.push({ name: 'apply', label: 'Update unpaid rows from this month onward', type: 'check', value: true });
  }
  formSheet({
    title: isNew ? 'New template' : 'Edit ' + t.name,
    hint: isNew ? 'It will be added to months you have already opened where it is due, and to future months as you open them.' : 'Paid rows are never changed.',
    fields: fields,
    submit: isNew ? 'Create' : 'Save',
    extra: isNew ? '' : '<button class="btn danger block" type="button" data-x="stop" style="margin-top:8px">' + I.stop + ' Stop after a month…</button>',
    bind: function (root) { var st = $('[data-x="stop"]', root); if (st) st.addEventListener('click', function () { stopTemplate(t.id, t.name, S.boot.currentMonth); }); },
    onSubmit: function (v) {
      var payload = { id: t ? t.id : '', name: v.name, amount: v.amount, category: v.category, every_n_months: v.every_n_months, due_day: v.due_day, start_month: v.start_month, end_month: v.end_month, active: isNew || v.active ? 'yes' : 'no' };
      return api('saveRecurring', payload, { applyToPending: !!v.apply }).then(function () { S.data.month = null; afterWrite(isNew ? 'Created ' + v.name : 'Saved ' + v.name); });
    }
  });
}

/* ------------------------------------------------------------------ sheet + forms */
function openSheet(html, bind, opts) {
  closeSheet();
  var host = $('#sheetHost');
  host.innerHTML = '<div class="backdrop"><div class="sheet" role="dialog"><div class="handle"></div>' + html + '</div></div>';
  var back = $('.backdrop', host);
  if (!(opts && opts.modal)) {
    back.addEventListener('click', function (e) { if (e.target === back) closeSheet(); });
    document.addEventListener('keydown', escClose);
  }
  if (bind) bind($('.sheet', host));
}
function escClose(e) { if (e.key === 'Escape') closeSheet(); }
function closeSheet() { $('#sheetHost').innerHTML = ''; document.removeEventListener('keydown', escClose); }
function formSheet(cfg) {
  var h = '<h2>' + esc(cfg.title) + '</h2>' + (cfg.hint ? '<p class="hint">' + esc(cfg.hint) + '</p>' : '') + '<form novalidate>';
  cfg.fields.forEach(function (f) {
    if (f.type === 'check') { h += '<div class="field check"><input type="checkbox" id="f_' + f.name + '" name="' + f.name + '" ' + (f.value ? 'checked' : '') + '><label for="f_' + f.name + '">' + esc(f.label) + '</label></div>'; return; }
    h += '<div class="field"><label for="f_' + f.name + '">' + esc(f.label) + '</label>';
    if (f.type === 'select') {
      h += '<select id="f_' + f.name + '" name="' + f.name + '">' + f.options.map(function (o) { return '<option value="' + esc(o.value) + '" ' + (String(o.value) === String(f.value) ? 'selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select>';
    } else if (f.type === 'number') {
      h += '<input type="number" inputmode="decimal" step="any" ' + (f.allowNegative ? '' : 'min="' + (f.min || 0) + '"') + (f.max ? ' max="' + f.max + '"' : '') + ' id="f_' + f.name + '" name="' + f.name + '" value="' + esc(f.value == null ? '' : f.value) + '" placeholder="' + esc(f.placeholder || '') + '" ' + (f.required ? 'required' : '') + ' ' + (f.autofocus ? 'autofocus' : '') + '>';
    } else {
      h += '<input type="text" id="f_' + f.name + '" name="' + f.name + '" value="' + esc(f.value == null ? '' : f.value) + '" placeholder="' + esc(f.placeholder || '') + '" ' + (f.required ? 'required' : '') + ' ' + (f.autofocus ? 'autofocus' : '') + '>';
    }
    h += '</div>';
  });
  h += '<div class="btn-row">' + (cfg.noCancel ? '' : '<button class="btn secondary" type="button" data-x="cancel">Cancel</button>') + '<button class="btn" type="submit">' + esc(cfg.submit || 'Save') + '</button></div>' + (cfg.extra || '') + '</form>';
  openSheet(h, function (root) {
    var form = $('form', root);
    var cancel = $('[data-x="cancel"]', root); if (cancel) cancel.addEventListener('click', closeSheet);
    if (cfg.bind) cfg.bind(root);
    var af = $('[autofocus]', root); if (af) setTimeout(function () { af.focus(); }, 50);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = {};
      cfg.fields.forEach(function (f) { var el = $('[name="' + f.name + '"]', form); v[f.name] = f.type === 'check' ? el.checked : el.value.trim(); });
      for (var i = 0; i < cfg.fields.length; i++) {
        var f = cfg.fields[i];
        if (f.required && !v[f.name]) { $('[name="' + f.name + '"]', form).focus(); return; }
        if (f.type === 'number' && v[f.name] !== '') {
          var n = Number(v[f.name]);
          if (isNaN(n) || (!f.allowNegative && n < 0) || (f.max && n > f.max) || (f.min && n < f.min)) { $('[name="' + f.name + '"]', form).focus(); return; }
        }
      }
      var btn = $('[type="submit"]', form); btn.disabled = true;
      Promise.resolve(cfg.onSubmit(v)).then(closeSheet).catch(function (err) { btn.disabled = false; showError(err); });
    });
  }, { modal: !!cfg.noCancel });
}

/* ------------------------------------------------------------------ toast */
var toastTimer = null;
function toast(msg, action) {
  var host = $('#toastHost');
  host.innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' + (action ? '<button>' + esc(action.label) + '</button>' : '') + '</div>';
  if (action) $('button', host).addEventListener('click', function () { host.innerHTML = ''; action.fn(); });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { host.innerHTML = ''; }, action ? 6000 : 3500);
}

init();
</script>
</body>
</html>
